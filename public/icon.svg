<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f5fbe"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0369a1" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Squircle with Gradient & Shadow -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" filter="url(#softShadow)"/>
  
  <!-- Subtle Top Highlight / Gloss -->
  <rect x="24" y="24" width="464" height="232" rx="108" fill="url(#glowGrad)"/>

  <!-- Medical Cross Foundation -->
  <g fill="#ffffff" fill-opacity="0.95">
    <!-- Vertical Bar -->
    <rect x="216" y="112" width="80" height="288" rx="20"/>
    <!-- Horizontal Bar -->
    <rect x="112" y="216" width="288" height="80" rx="20"/>
  </g>

  <!-- Intertwined Heart Shape -->
  <path d="M256 360 C180 300 144 240 144 190 C144 150 174 124 214 124 C238 124 250 138 256 148 C262 138 274 124 298 124 C338 124 368 150 368 190 C368 240 332 300 256 360 Z"
        fill="#0284c7" fill-opacity="0.9" stroke="#ffffff" stroke-width="12" stroke-linejoin="round"/>

  <!-- Glowing Heartbeat Pulse Wave -->
  <path d="M120 256 L190 256 L220 180 L256 330 L292 200 L322 256 L392 256"
        fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
